# WZORCE ZAPYTAŃ DO GRAFU DOKUMENTACJI
#
# Ten plik czyta serwer zapytań. Opisuje, którędy zapytanie przechodzi od
# jednego dokumentu do kolejnych, żeby zebrać powiązane dokumenty.
# Plik relation-matrix.yaml mówi tylko, jakie relacje wolno zapisać. Nie mówi,
# którędy idzie zapytanie. To wynika wyłącznie z wzorców w tym pliku.
# Skróty typów dokumentów i wierszy są wyjaśnione na początku relation-matrix.yaml.
#
# Są dwa zapytania:
#   change_scope     Zasięg zmiany. Odpowiada na pytanie: które pliki trzeba
#                    przejrzeć, gdy zmieniam dany dokument albo wiersz?
#                    Wynik zawęża przegląd do plików, które mogą wymagać
#                    zmiany. Nie oznacza, że każdy z nich na pewno trzeba zmienić.
#   implementation   Implementacja. Odpowiada na pytanie: co trzeba przeczytać,
#                    żeby zbudować to, co opisuje dany dokument?
#
# JAK CZYTAĆ WZORZEC
# Wzorzec to ciąg kroków. Każdy krok przechodzi po jednej relacji do węzłów
# jednego lub kilku typów. Węzeł to dokument albo wiersz w dokumencie.
#   "-relacja-> TYP"   Bieżący węzeł ma w swoim front matter wpis tej relacji,
#                      który wskazuje węzeł typu TYP. Zapytanie przechodzi
#                      do tego węzła.
#   "<-relacja- TYP"   Węzeł typu TYP ma w swoim front matter wpis tej relacji,
#                      który wskazuje bieżący węzeł. Zapytanie przechodzi
#                      do tego węzła.
#   TYP1|TYP2          Pasuje węzeł dowolnego z podanych typów.
#   *                  Pasuje węzeł dowolnego typu, na który matryca relacji
#                      pozwala w tej relacji.
# Strzałka pokazuje tylko, który dokument ma wpis w front matter. Nie pokazuje,
# w którą stronę rozchodzi się wpływ zmiany.
# Typ w kroku działa jak filtr. Na przykład krok "-realizes-> DOM" pomija wpisy
# realizes, które wskazują wiersz RD, bo RD nie jest typem DOM.
#
# JAK DZIAŁA DOPASOWANIE
#   1. Zapytanie zaczyna od wybranego węzła i wykonuje kroki wzorca po kolei.
#      Jeśli w danym kroku pasuje kilka węzłów, zapytanie idzie dalej od
#      każdego z nich osobno.
#   2. Wzorzec nie musi dopasować się do końca. Jeśli od jakiegoś węzła nie da
#      się wykonać kolejnego kroku, ta ścieżka się kończy. Wszystkie węzły
#      odwiedzone do tego miejsca i tak trafiają do wyniku.
#   3. Zapytanie idzie tylko tam, gdzie prowadzi wzorzec. Nie ma osobnego
#      limitu głębokości, bo granicą jest liczba kroków we wzorcu. O tym, czy
#      zapytanie pójdzie dalej od węzła, decyduje droga, którą do niego doszło,
#      a nie sam węzeł.
#   4. Typ węzła startowego to jego typ z matrycy relacji: typ dokumentu
#      (na przykład ENT) albo typ wiersza (na przykład REQ). Od tego typu
#      zależy, które wzorce zostaną użyte.
#
# PRZYKŁAD
# Zapytanie change_scope dla encji ENT-Disposition, wzorzec
# "-realizes-> DOM <-contains- DDM":
#   start              Zapytanie zaczyna od ENT-Disposition.
#   -realizes-> DOM    ENT-Disposition ma wpis realizes DDM-001.DOM-Dyspozycja.
#                      Zapytanie przechodzi do wiersza DDM-001.DOM-Dyspozycja.
#   <-contains- DDM    DDM-001 ma wpis contains DOM-Dyspozycja.
#                      Zapytanie przechodzi do dokumentu DDM-001.
#   wynik              Wiersz DDM-001.DOM-Dyspozycja i dokument DDM-001,
#                      który trzeba przejrzeć.
# Encja ENT-StatusDict nie ma wpisu realizes, więc dla niej ten wzorzec
# niczego nie dodaje do wyniku.

# ZASIĘG ZMIANY: które pliki przejrzeć, gdy zmieniam węzeł danego typu.
change_scope:

  # Zmieniam wymaganie funkcjonalne REQ albo regułę biznesową RB w BFS.
  REQ|RB:
    # Scenariusze UC i TUC, które realizują ten wiersz, oraz API, integracje
    # i zdarzenia, z których te scenariusze korzystają.
    - "<-realizes- UC|TUC -consumes-> API|INT|QUE"
    # Ekrany scenariuszy UC, które realizują ten wiersz, i sekcje tych ekranów.
    # TUC nie ma ekranów, bo działa bez udziału człowieka.
    - "<-realizes- UC -contains-> SCR -contains-> SCRSEC"
    # Mapy nawigacji NAV, które zestawiają ekrany tych scenariuszy UC.
    - "<-realizes- UC -contains-> SCR <-groups- NAV"
    # Zdolności, do których należą te scenariusze, oraz przepływy FLOW,
    # procesy BPMN i maszyny stanów STM, które należą do tych zdolności.
    - "<-realizes- UC|TUC -realizes-> CAP <-realizes- FLOW|BPMN|STM"
    # Mapy scenariuszy UCMAP, które zestawiają te scenariusze.
    - "<-realizes- UC|TUC <-groups- UCMAP"

  # Zmieniam próg jakościowy, czyli wiersz NFRT w dokumencie NFR.
  NFRT:
    # Wszystkie dokumenty, które bezpośrednio wskazują ten próg.
    - "<-constrained_by- *"
    # Zdolności, które wskazują ten próg, oraz wszystkie dokumenty należące do
    # tych zdolności. Przykład: dla NFR-002.NFRT-SEC-02 wynik zawiera API-020,
    # bo API-020 należy do CAP-020, a CAP-020 wskazuje ten próg.
    - "<-constrained_by- CAP <-realizes- *"

  # Zmieniam konwencję.
  CONV:
    # Kontrakty, które ją stosują. Kontrakt, który odstępuje od konwencji, nie
    # wskazuje jej, więc nie trafia do wyniku. Przykład: dla CONV-003 wynik
    # zawiera INT-001, ale nie INT-003.
    - "<-applies- *"

  # Zmieniam zdolność.
  CAP:
    # Wszystkie dokumenty, które należą do tej zdolności.
    - "<-realizes- *"

  # Zmieniam API, integrację albo zdarzenie.
  API|INT|QUE:
    # Wszystkie dokumenty, które korzystają z tego elementu: wywołują go,
    # publikują zdarzenie albo je odbierają. Encje, z których korzysta sam
    # element, nie trafiają tu do wyniku.
    - "<-consumes- *"
    # Przepływy FLOW, które wołają tę integrację albo publikują to zdarzenie,
    # oraz aktywności tych przepływów. Przykład: dla INT-001 wynik zawiera
    # FLOW-001 i jego aktywność ACT-002.
    - "<-consumes- FLOW -contains-> ACT"
    # API, które korzystają z tych przepływów. Przykład: dla INT-010 wynik
    # zawiera API-011, bo API-011 korzysta z FLOW-010, a FLOW-010 woła INT-010.
    - "<-consumes- FLOW <-consumes- API"
    # Przepływy, z których korzysta zmieniane API, oraz aktywności tych
    # przepływów. Przykład: dla API-001 wynik zawiera FLOW-001 i jego
    # aktywność ACT-002.
    - "-consumes-> FLOW -contains-> ACT"
    # Kroki procesu typu user-task, które zmieniane API przypisuje, odkłada
    # albo kończy. Przykład: dla API-008 wynik zawiera SPEC-WF-005.
    - "-consumes-> SPEC-WF"

  # Zmieniam encję.
  ENT:
    # Dokumenty, które korzystają z encji: API, INT, QUE i sekcje ekranów SCRSEC.
    - "<-consumes- *"
    # Encja, która zawiera zmienianą encję, oraz dokumenty korzystające z tej
    # encji nadrzędnej. Wzorzec sięga tylko jeden poziom w górę.
    - "<-contains- ENT <-consumes- *"
    # Logiczny model danych LDM, do którego należy encja.
    - "<-contains- LDM"
    # Encje, które zmieniana encja zawiera.
    - "-contains-> ENT"
    # Pojęcie domenowe, które encja realizuje, i DDM, w którym to pojęcie
    # jest opisane.
    - "-realizes-> DOM <-contains- DDM"
    # Inne encje i maszyny stanów, które realizują to samo pojęcie.
    # Przykłady: dla ENT-Account wynik zawiera ENT-Deposit, a dla
    # ENT-Disposition wynik zawiera STM-001.
    - "-realizes-> DOM <-realizes- ENT|STM"

  # Zmieniam pojęcie domenowe, czyli wiersz DOM w DDM.
  DOM:
    # Encje, które realizują to pojęcie, i dokumenty korzystające z tych encji.
    - "<-realizes- ENT <-consumes- *"
    # Encje, które zawierają te encje, i dokumenty korzystające z tych encji
    # nadrzędnych.
    - "<-realizes- ENT <-contains- ENT <-consumes- *"
    # Maszyny stanów, które realizują to pojęcie.
    - "<-realizes- STM"
    # Logiczne modele danych LDM, które realizują to pojęcie.
    - "<-realizes- LDM"

  # Zmieniam regułę domenową, czyli wiersz RD w DDM.
  RD:
    # Encje, które realizują tę regułę, i dokumenty korzystające z tych encji.
    - "<-realizes- ENT <-consumes- *"
    # Encje, które zawierają te encje, i dokumenty korzystające z tych encji
    # nadrzędnych.
    - "<-realizes- ENT <-contains- ENT <-consumes- *"
    # Encje zawarte w tych encjach i dokumenty korzystające z tych encji
    # podrzędnych.
    - "<-realizes- ENT -contains-> ENT <-consumes- *"

  # Zmieniam regułę walidacyjną, czyli wiersz RW w encji.
  RW:
    # Encja, w której leży reguła, i dokumenty korzystające z tej encji.
    - "<-contains- ENT <-consumes- *"
    # Encja, która zawiera tę encję, i dokumenty korzystające z encji nadrzędnej.
    - "<-contains- ENT <-contains- ENT <-consumes- *"
    # Encje zawarte w tej encji i dokumenty korzystające z tych encji
    # podrzędnych. Przykład: dla ENT-Disposition.RW-001 wynik zawiera SCRSEC-002.
    - "<-contains- ENT -contains-> ENT <-consumes- *"

  # Zmieniam maszynę stanów.
  STM:
    # Pojęcie, które maszyna realizuje, encje realizujące to samo pojęcie
    # i dokumenty korzystające z tych encji. Przykład: dla STM-001 wynik
    # zawiera ENT-Disposition i API-001.
    - "-realizes-> DOM <-realizes- ENT <-consumes- *"
    # Inne maszyny stanów tego samego pojęcia. Przykład: dla STM-010 wynik
    # zawiera STM-014.
    - "-realizes-> DOM <-realizes- STM"
    # DDM, w którym jest opisane pojęcie maszyny.
    - "-realizes-> DOM <-contains- DDM"
    # Zdolność, do której należy maszyna, i wszystkie dokumenty tej zdolności.
    # Przykład: dla STM-013 wynik zawiera CAP-020 i UC-019.
    - "-realizes-> CAP <-realizes- *"

  # Zmieniam rolę aktora, czyli wiersz ROLE w ACTOR.
  ROLE:
    # Scenariusze UC i TUC oraz kroki procesu SPEC-WF, w których ta rola
    # uczestniczy.
    - "<-involves- UC|TUC|SPEC-WF"

  # Zmieniam scenariusz UC albo TUC.
  # Wymagania REQ i reguły RB, które scenariusz realizuje, nie trafiają do
  # wyniku, bo żaden wzorzec poniżej do nich nie prowadzi.
  UC|TUC:
    # API, integracje i zdarzenia, z których scenariusz korzysta.
    - "-consumes-> API|INT|QUE"
    # Ekrany scenariusza.
    - "-contains-> SCR"
    # Sekcje ekranów, które wskazują kroki scenariusza UC. Przykład: dla
    # UC-010 wynik zawiera SCRSEC-010.
    - "-contains-> SCRSEC"
    # Mapy nawigacji NAV, które zestawiają ekrany scenariusza. Przykład:
    # dla UC-001 wynik zawiera NAV-001.
    - "-contains-> SCR <-groups- NAV"
    # Mapy scenariuszy UCMAP, które zestawiają ten scenariusz. Przykład:
    # dla UC-001 wynik zawiera UCMAP-001.
    - "<-groups- UCMAP"

  # Zmieniam ekran.
  SCR:
    # Scenariusze UC, które zawierają ten ekran.
    - "<-contains- UC"
    # Mapy nawigacji NAV, które zestawiają ten ekran. Przykład: dla SCR-002
    # wynik zawiera NAV-001.
    - "<-groups- NAV"

  # Zmieniam sekcję ekranu.
  SCRSEC:
    # Ekrany, które zawierają tę sekcję.
    - "<-contains- SCR"
    # Scenariusze UC, których kroki wskazują tę sekcję. Przykład: dla
    # SCRSEC-010 wynik zawiera UC-010.
    - "<-contains- UC"

  # Zmieniam krok procesu BPMN.
  SPEC-WF:
    # Kroki, które odczytują zmienne z tego kroku.
    - "<-consumes- SPEC-WF"
    # Proces BPMN, do którego należy krok.
    - "<-contains- BPMN"
    # API, które przypisują, odkładają albo kończą krok typu user-task.
    # Przykład: dla SPEC-WF-005 wynik zawiera API-015 i API-008.
    - "<-consumes- API"

  # Zmieniam proces BPMN.
  BPMN:
    # Kroki tego procesu.
    - "-contains-> SPEC-WF"
    # API i przepływy, które uruchamiają ten proces. Przykład: dla BPMN-001
    # wynik zawiera API-006.
    - "<-consumes- API|FLOW"
    # API, które korzystają z przepływów uruchamiających ten proces.
    - "<-consumes- FLOW <-consumes- API"

  # Zmieniam przepływ.
  FLOW:
    # Aktywności tego przepływu.
    - "-contains-> ACT"
    # API, które korzystają z tego przepływu. Przykład: dla FLOW-001 wynik
    # zawiera API-001.
    - "<-consumes- API"

  # Zmieniam aktywność przepływu.
  ACT:
    # Przepływy, które zawierają tę aktywność.
    - "<-contains- FLOW"
    # API, które korzystają z tych przepływów. Przykład: dla ACT-001 wynik
    # zawiera API-001, bo API-001 korzysta z FLOW-001 i FLOW-002.
    - "<-contains- FLOW <-consumes- API"

  # Mapy UCMAP i NAV nie mają własnych wzorców. Trafiają do wyniku przez wzorce
  # dla REQ i RB, dla UC i TUC oraz dla SCR.

# IMPLEMENTACJA: co przeczytać, żeby zbudować to, co opisuje węzeł danego typu.
implementation:

  # Buduję scenariusz UC albo TUC.
  UC|TUC:
    # Wymagania REQ i reguły biznesowe RB, które scenariusz realizuje.
    - "-realizes-> REQ|RB"
    # Zdolności, do których należy scenariusz, i progi jakościowe tych zdolności.
    - "-realizes-> CAP -constrained_by-> NFRT"
    # Role aktorów, które uczestniczą w scenariuszu.
    - "-involves-> ROLE"
    # Progi jakościowe, które scenariusz wskazuje bezpośrednio.
    - "-constrained_by-> NFRT"
    # API, integracje i zdarzenia, z których korzysta scenariusz; encje
    # i integracje, z których one z kolei korzystają; pojęcia domenowe tych
    # encji i maszyny stanów tych pojęć. Przykład: dla UC-001 wynik zawiera
    # STM-001.
    - "-consumes-> API|INT|QUE -consumes-> ENT|INT -realizes-> DOM <-realizes- STM"
    # To samo dla encji zawartych w tych encjach: encje podrzędne, ich pojęcia
    # i maszyny stanów tych pojęć.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> ENT -realizes-> DOM <-realizes- STM"
    # Reguły walidacyjne encji, z których korzystają wywołania scenariusza.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> RW"
    # Reguły walidacyjne encji zawartych w tych encjach.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> ENT -contains-> RW"
    # Progi jakościowe wywołań scenariusza. Taki próg mogą mieć tylko API
    # i INT, bo matryca relacji nie pozwala zdarzeniu QUE wskazywać progów.
    - "-consumes-> API|INT|QUE -constrained_by-> NFRT"
    # Konwencje, które stosują wywołania scenariusza: model odpowiedzi
    # błędnej, autentykacja, ponawianie wywołań, nagłówki komunikatów.
    # Przykład: dla UC-011 wynik zawiera CONV-001 i CONV-002, bo stosuje je
    # API-003.
    - "-consumes-> API|INT|QUE -applies-> CONV"
    # Przepływy FLOW, z których korzystają wywoływane API, oraz aktywności
    # tych przepływów. Przykład: dla UC-001 wynik zawiera FLOW-001, FLOW-002
    # i ich aktywności.
    - "-consumes-> API -consumes-> FLOW -contains-> ACT"
    # Integracje, zdarzenia i procesy BPMN, które wołają te przepływy.
    # Przykład: dla UC-001 wynik zawiera INT-001, bo woła ją FLOW-001.
    - "-consumes-> API -consumes-> FLOW -consumes-> INT|QUE|BPMN"
    # Konwencje, które stosują te integracje i zdarzenia. Przykład: dla UC-001
    # wynik zawiera CONV-003, bo FLOW-001 woła INT-001, a INT-001 stosuje
    # CONV-003.
    - "-consumes-> API -consumes-> FLOW -consumes-> INT|QUE -applies-> CONV"
    # Przepływy FLOW, które korzystają z tych samych integracji i zdarzeń co
    # scenariusz, oraz aktywności tych przepływów. Przykład: dla UC-001 wynik
    # zawiera FLOW-001, bo FLOW-001 też publikuje QUE-001.
    - "-consumes-> INT|QUE <-consumes- FLOW -contains-> ACT"
    # Kroki procesu typu user-task, które obsługują API wołane przez scenariusz.
    # Przykład: dla UC-004 wynik zawiera SPEC-WF-005, bo API-008 kończy ten krok.
    - "-consumes-> API -consumes-> SPEC-WF"
    # Ekrany scenariusza, sekcje tych ekranów, encje i API, z których
    # korzystają sekcje, pojęcia domenowe tych encji i maszyny stanów tych
    # pojęć.
    - "-contains-> SCR -contains-> SCRSEC -consumes-> ENT|API -realizes-> DOM <-realizes- STM"
    # Reguły walidacyjne encji, z których korzystają sekcje ekranów scenariusza.
    - "-contains-> SCR -contains-> SCRSEC -consumes-> ENT -contains-> RW"
    # Konwencje, które stosują API wołane przez sekcje ekranów scenariusza.
    # Przykład: dla UC-010 wynik zawiera CONV-001, bo SCRSEC-010 woła API-009.
    - "-contains-> SCR -contains-> SCRSEC -consumes-> API -applies-> CONV"

  # Buduję krok procesu BPMN.
  SPEC-WF:
    # Proces BPMN, do którego należy krok.
    - "<-contains- BPMN"
    # Kroki, z których ten krok odczytuje zmienne.
    - "-consumes-> SPEC-WF"
    # Rola, która wykonuje krok typu user-task.
    - "-involves-> ROLE"
    # API, integracje i zdarzenia, z których korzysta krok; encje i integracje,
    # z których one z kolei korzystają; pojęcia domenowe tych encji i maszyny
    # stanów tych pojęć.
    - "-consumes-> API|INT|QUE -consumes-> ENT|INT -realizes-> DOM <-realizes- STM"
    # To samo dla encji zawartych w tych encjach: encje podrzędne, ich pojęcia
    # i maszyny stanów tych pojęć.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> ENT -realizes-> DOM <-realizes- STM"
    # Reguły walidacyjne encji, z których korzystają wywołania kroku.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> RW"
    # Reguły walidacyjne encji zawartych w tych encjach.
    - "-consumes-> API|INT|QUE -consumes-> ENT -contains-> ENT -contains-> RW"
    # Progi jakościowe wywołań kroku. Taki próg mogą mieć tylko API i INT,
    # bo matryca relacji nie pozwala zdarzeniu QUE wskazywać progów.
    - "-consumes-> API|INT|QUE -constrained_by-> NFRT"
    # Zdolności, do których należą wywołania kroku, i progi jakościowe tych
    # zdolności. Przykład: dla SPEC-WF-010 wynik zawiera NFR-001.NFRT-PERF-02,
    # bo wywołanie kroku należy do CAP-014, a CAP-014 wskazuje ten próg.
    - "-consumes-> API|INT|QUE -realizes-> CAP -constrained_by-> NFRT"
    # Konwencje, które stosują wywołania kroku. Przykład: dla SPEC-WF-002
    # wynik zawiera CONV-003, bo krok woła INT-002, a INT-002 stosuje CONV-003.
    - "-consumes-> API|INT|QUE -applies-> CONV"
    # Przepływy FLOW, z których korzystają wywoływane API, oraz aktywności
    # tych przepływów. Przykład: dla SPEC-WF-011 wynik zawiera FLOW-010
    # i ACT-010.
    - "-consumes-> API -consumes-> FLOW -contains-> ACT"
    # Integracje, zdarzenia i procesy BPMN, które wołają te przepływy.
    - "-consumes-> API -consumes-> FLOW -consumes-> INT|QUE|BPMN"
    # Konwencje, które stosują te integracje i zdarzenia. Przykład: dla
    # SPEC-WF-011 wynik zawiera CONV-003, bo API-011 korzysta z FLOW-010,
    # a FLOW-010 woła INT-010.
    - "-consumes-> API -consumes-> FLOW -consumes-> INT|QUE -applies-> CONV"
    # Przepływy FLOW, które korzystają z tych samych integracji i zdarzeń co
    # krok, oraz aktywności tych przepływów.
    - "-consumes-> INT|QUE <-consumes- FLOW -contains-> ACT"
    # API, które przypisują, odkładają albo kończą krok typu user-task; encje,
    # z których te API korzystają; pojęcia domenowe tych encji i maszyny stanów
    # tych pojęć.
    # Przykład: dla SPEC-WF-005 wynik zawiera API-008 i ENT-Complaint.
    - "<-consumes- API -consumes-> ENT -realizes-> DOM <-realizes- STM"

  # Buduję API, integrację albo zdarzenie.
  API|INT|QUE:
    # Zdolność, do której należy element, i progi jakościowe tej zdolności.
    - "-realizes-> CAP -constrained_by-> NFRT"
    # Encje, z których korzysta element, pojęcia domenowe tych encji i maszyny
    # stanów tych pojęć.
    - "-consumes-> ENT -realizes-> DOM <-realizes- STM"
    # To samo dla encji zawartych w tych encjach: encje podrzędne, ich pojęcia
    # i maszyny stanów tych pojęć.
    - "-consumes-> ENT -contains-> ENT -realizes-> DOM <-realizes- STM"
    # Reguły walidacyjne encji, z których korzysta element.
    - "-consumes-> ENT -contains-> RW"
    # Reguły walidacyjne encji zawartych w tych encjach.
    - "-consumes-> ENT -contains-> ENT -contains-> RW"
    # Integracje, które API woła poza swoimi przepływami.
    - "-consumes-> INT"
    # Przepływy, z których korzysta API, i aktywności tych przepływów.
    # Przykład: dla API-001 wynik zawiera FLOW-001, FLOW-002 i ich aktywności.
    - "-consumes-> FLOW -contains-> ACT"
    # Integracje, zdarzenia i procesy BPMN, które wołają te przepływy.
    # Przykład: dla API-001 wynik zawiera INT-001 i QUE-001.
    - "-consumes-> FLOW -consumes-> INT|QUE|BPMN"
    # Procesy BPMN, które API uruchamia. Przykład: dla API-006 wynik zawiera
    # BPMN-001.
    - "-consumes-> BPMN"
    # Kroki procesu typu user-task, które API przypisuje, odkłada albo kończy,
    # i procesy tych kroków. Proces podaje identyfikatory procesu i zadania
    # w silniku. Przykład: dla API-008 wynik zawiera SPEC-WF-005 i BPMN-002.
    - "-consumes-> SPEC-WF <-contains- BPMN"
    # Progi jakościowe, które element wskazuje bezpośrednio.
    - "-constrained_by-> NFRT"
    # Konwencje, które element stosuje. Przykład: dla API-003 wynik zawiera
    # CONV-001 i CONV-002.
    - "-applies-> CONV"
    # Konwencje integracji, które API woła poza swoimi przepływami. Przykład:
    # dla API-003 wynik zawiera CONV-003, bo API-003 woła INT-010.
    - "-consumes-> INT -applies-> CONV"
    # Konwencje integracji i zdarzeń, które wołają przepływy API. Przykład:
    # dla API-001 wynik zawiera CONV-003 i CONV-004, bo FLOW-001 woła INT-001
    # i publikuje QUE-001.
    - "-consumes-> FLOW -consumes-> INT|QUE -applies-> CONV"
