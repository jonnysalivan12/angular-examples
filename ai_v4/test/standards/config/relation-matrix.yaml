---
# MATRYCA RELACJI
#
# Ten plik mówi, jakie powiązania wolno zapisać między dokumentami.
# Każde powiązanie to trójka: typ dokumentu źródłowego, rodzaj relacji i typ
# dokumentu docelowego. Na przykład trójka „UC realizes REQ” oznacza, że
# scenariusz użycia (UC) może wskazać wymaganie funkcjonalne (REQ), które
# realizuje. Jeśli trójki nie ma na liście poniżej, takiego powiązania nie
# wolno zapisać i walidator zgłosi błąd.
#
# Ten plik czyta walidator. Drugi plik, query-patterns.yaml, opisuje zapytania
# do grafu (zasięg zmiany i implementacja), czyli którędy zapytanie przechodzi
# od dokumentu do dokumentu.
#
# Typy dokumentów używane w tym pliku:
#   BFS      specyfikacja biznesowo-funkcjonalna: wymagania i reguły jednego procesu
#   NFR      wymagania niefunkcjonalne, czyli jakościowe
#   ACTOR    wspólna baza aktorów
#   CAP      zdolność: zakres odpowiedzialności komponentu
#   UC       scenariusz użycia, w którym działa użytkownik
#   TUC      scenariusz techniczny, uruchamiany automatycznie, bez człowieka
#   SCR      ekran
#   SCRSEC   sekcja ekranu
#   API      punkt końcowy API
#   INT      integracja z systemem zewnętrznym
#   QUE      zdarzenie publikowane przez brokera komunikatów
#   CONV     konwencja: wspólne zasady kontraktów, np. model odpowiedzi błędnej API
#   FLOW     przepływ biznesowy lub techniczny
#   ACT      aktywność w przepływie
#   BPMN     proces w silniku Workflow
#   SPEC-WF  krok procesu BPMN
#   DDM      domenowy model danych: znaczenie pojęć
#   LDM      logiczny model danych: spis encji jednego obszaru
#   ENT      encja modelu logicznego
#   STM      maszyna stanów: cykl życia obiektu
#   UCMAP    mapa powiązań między scenariuszami UC i TUC
#   NAV      mapa nawigacji między ekranami
#
# Wiersze wewnątrz dokumentów (identyfikatory lokalne):
#   REQ   wymaganie funkcjonalne, wiersz w BFS
#   RB    reguła biznesowa, wiersz w BFS
#   DOM   pojęcie domenowe, wiersz w DDM
#   RD    reguła lub niezmiennik domenowy, wiersz w DDM
#   RW    reguła walidacyjna, wiersz w ENT
#   NFRT  próg jakościowy, wiersz macierzy wymagań w NFR
#   ROLE  rola aktora, wiersz w ACTOR
#   AC    kryterium akceptacji, wiersz w SPEC-WF
#   A     wariant przebiegu, wiersz w UC lub TUC
#   E     sytuacja błędna, wiersz w UC lub TUC
#
# UNIKALNOŚĆ IDENTYFIKATORÓW
# Identyfikator dokumentu (doc-id) musi być unikalny w całej dokumentacji,
# bez względu na typ dokumentu. Jeśli dwa dokumenty mają ten sam doc-id,
# walidator zgłasza błąd.
#
# WZMIANKI O IDENTYFIKATORACH W TREŚCI
# Jeśli dokument wspomina w treści identyfikator innego dokumentu albo jego
# wiersza, ten dokument musi mieć w polu relations wpis, który wskazuje
# wspomniany dokument albo jeden z jego wierszy. Rodzaju relacji się nie
# wybiera: dla każdej pary typów matryca ma tylko jeden rodzaj relacji.
# Przykład:
#   UC-001 wspomina BFS-001. Wystarczy, że UC-001 ma wpis
#   „realizes BFS-001.REQ-01”, czyli wskazuje jeden z wierszy BFS-001.
#
# Dokument nie wspomina w treści dokumentów, które go wskazują. Jeśli matryca
# ma trójkę tylko w przeciwnym kierunku, relację zapisuje drugi dokument,
# a wzmiankę trzeba usunąć. Przykład:
#   SPEC-WF-001 nie wspomina BPMN-001. Relację zapisuje BPMN-001 wpisem
#   „contains SPEC-WF-001”.
#
# Jeśli matryca nie ma żadnej trójki dla tej pary typów, w żadnym kierunku,
# sama wzmianka jest błędem. Przykład:
#   SCR-001 wspomina SCR-002. To błąd, bo matryca nie ma trójki, w której
#   ekran wskazuje inny ekran.
#
# LICZEBNOŚĆ (pole cardinality)
# Pole cardinality mówi, ile źródeł i ile celów może mieć relacja. Zapis
# „źródła:cele” jest taki sam jak na diagramach ER.
#   1:N  Jedno źródło może wskazywać wiele celów, ale każdy cel ma tylko
#        jedno źródło. Przykład: BFS contains REQ, bo wymaganie leży
#        w jednym BFS, a BFS ma wiele wymagań.
#   N:1  Wiele źródeł może wskazywać ten sam cel, ale każde źródło wskazuje
#        tylko jeden cel. Przykład: ENT realizes DOM, bo encja realizuje
#        jedno pojęcie, a jedno pojęcie może mieć kilka encji.
#   N:N  Brak ograniczeń po obu stronach. Przykład: SCR contains SCRSEC,
#        bo ekran ma wiele sekcji, a sekcja może być wspólna dla kilku ekranów.

# RODZAJE RELACJI
#   contains        Dokument zawiera coś jako swoją część: własne wiersze
#                   (BFS-001 zawiera REQ-01) albo osobne pliki (SCR-001
#                   zawiera SCRSEC-001).
#   realizes        Dokument dostarcza to, co obiecuje cel (UC-001 realizuje
#                   wymaganie BFS-001.REQ-01).
#   constrained_by  Dokument musi spełnić próg jakościowy z NFR (API-001 musi
#                   spełnić próg NFR-001.NFRT-PERF-01).
#   applies         Dokument stosuje konwencję (API-009 stosuje model
#                   odpowiedzi błędnej z CONV-001). Wpis ma dokument, który
#                   stosuje konwencję. Konwencja nie wymienia takich dokumentów.
#   consumes       Dokument korzysta z innego: wywołuje jego zachowanie,
#                   czyta jego dane, publikuje zdarzenie albo je odbiera.
#   involves        W dokumencie uczestniczy rola aktora.
#   groups          Dokument zestawia cudze dokumenty w jeden widok, jak mapa.
relation_types:
  - contains
  - realizes
  - constrained_by
  - applies
  - consumes
  - involves
  - groups

matrix:

  # ── Grupa 1: dokument zawiera własne wiersze ───────────────────────────
  # Identyfikator lokalny to wiersz w dokumencie, a nie osobny plik. Na
  # przykład REQ-01 to wiersz w tabeli wymagań dokumentu BFS-001. Inne
  # dokumenty wskazują taki wiersz pełnym identyfikatorem, czyli z doc-id
  # dokumentu na początku: UC-001 realizes BFS-001.REQ-01.
  # Każdy rodzaj wiersza ma własny prefiks, inny niż prefiksy dokumentów.
  # Dzięki temu już po prefiksie wiadomo, czym jest wiersz: NFRT-PERF-01 to
  # próg jakościowy w NFR-001, a ROLE-01 to rola w ACTOR-001.

  # BFS numeruje swoje wymagania funkcjonalne REQ i reguły biznesowe RB:
  # BFS-001 contains REQ-01 i RB-01.
  - { source: BFS,      relation: contains,        target: REQ,      cardinality: "1:N" }
  - { source: BFS,      relation: contains,        target: RB,       cardinality: "1:N" }
  # DDM numeruje swoje pojęcia domenowe DOM i reguły domenowe RD:
  # DDM-001 contains DOM-Dyspozycja i RD-001.
  - { source: DDM,      relation: contains,        target: DOM,      cardinality: "1:N" }
  - { source: DDM,      relation: contains,        target: RD,       cardinality: "1:N" }
  # Reguła walidacyjna RW leży w tej encji, której dane sprawdza. Niezmiennik
  # agregatu, czyli reguła obejmująca całą grupę powiązanych encji, leży
  # w encji głównej tego agregatu. Encja numeruje swoje reguły w tabeli
  # „Reguły walidacyjne”: ENT-Disposition contains RW-001.
  # API i sekcja ekranu (SCRSEC) nie mają własnej relacji do reguły RW.
  # Docierają do niej przez encję, z której korzystają.
  # Reguła, która dotyczy kilku agregatów naraz, nie jest regułą RW w encji.
  # Zapisuje się ją jako regułę domenową RD w DDM albo regułę biznesową RB w BFS.
  - { source: ENT,      relation: contains,        target: RW,       cardinality: "1:N" }
  # NFR numeruje wiersze swojej „Macierzy wymagań”: NFR-001 contains NFRT-PERF-01.
  - { source: NFR,      relation: contains,        target: NFRT,     cardinality: "1:N" }
  # ACTOR numeruje role w tabeli „Aktorzy”: ACTOR-001 contains ROLE-01.
  - { source: ACTOR,    relation: contains,        target: ROLE,     cardinality: "1:N" }
  # Krok procesu SPEC-WF numeruje swoje kryteria akceptacji:
  # SPEC-WF-001 contains AC-01.
  - { source: SPEC-WF,  relation: contains,        target: AC,       cardinality: "1:N" }
  # Scenariusz UC lub TUC numeruje swoje warianty przebiegu (A1, A2 i kolejne)
  # oraz sytuacje błędne (E1, E2 i kolejne): UC-001 contains A1 i E1.
  - { source: UC,       relation: contains,        target: A,        cardinality: "1:N" }
  - { source: UC,       relation: contains,        target: E,        cardinality: "1:N" }
  - { source: TUC,      relation: contains,        target: A,        cardinality: "1:N" }
  - { source: TUC,      relation: contains,        target: E,        cardinality: "1:N" }

  # ── Grupa 2: całość zawiera osobne pliki ───────────────────────────────
  # Tutaj część jest osobnym dokumentem z własnym plikiem, a nie wierszem.
  # Całość wymienia swoje części w treści i ma do nich wpis contains.
  # Gdy ktoś usunie część, walidator zgłosi błąd „cel nie istnieje” w pliku
  # całości, bo całość nadal wskazuje usunięty dokument. Przykład: po usunięciu
  # SCRSEC-002 błąd pojawia się w SCR-001.
  # Usunięcie całości nie oznacza, że trzeba usunąć jej części. O tym, czy
  # usunąć także części, decyduje analityk po sprawdzeniu zasięgu zmiany
  # (zapytanie change_scope).

  # Ekran zawiera sekcje. Jedna sekcja może należeć do kilku ekranów.
  - { source: SCR,      relation: contains,        target: SCRSEC,   cardinality: "N:N" }
  # Przepływ zawiera aktywności. Jedna aktywność może należeć do kilku przepływów.
  - { source: FLOW,     relation: contains,        target: ACT,      cardinality: "N:N" }
  # Proces BPMN zawiera kroki. Każdy krok należy do jednego procesu.
  - { source: BPMN,     relation: contains,        target: SPEC-WF,  cardinality: "1:N" }
  # Każda encja należy do dokładnie jednego logicznego modelu danych (LDM).
  # Jeden DDM może mieć kilka LDM, na przykład osobny dla systemu
  # transakcyjnego i osobny dla hurtowni danych. Wtedy encja w drugim modelu
  # dostaje nazwę, która pokazuje różnicę: ENT-Account w systemie
  # transakcyjnym i ENT-AccountSnapshot w hurtowni. Nazwa encji jest
  # jednocześnie jej doc-id, a doc-id musi być unikalny, więc dwie encje
  # o tej samej nazwie to błąd.
  - { source: LDM,      relation: contains,        target: ENT,      cardinality: "1:N" }
  # Scenariusz UC wskazuje ekrany wymienione w kolumnie „Ekran” w tabelach
  # kroków: UC-001 contains SCR-001. Ten sam ekran może występować w kilku
  # scenariuszach.
  - { source: UC,       relation: contains,        target: SCR,      cardinality: "N:N" }
  # Krok scenariusza UC, który opisuje pracę użytkownika w jednej sekcji
  # ekranu, wskazuje tę sekcję w kolumnie „Sekcja” w tabelach kroków:
  # UC-010 contains SCRSEC-010. Ta sama sekcja może występować w kilku
  # scenariuszach.
  - { source: UC,       relation: contains,        target: SCRSEC,   cardinality: "N:N" }
  # Encja może zawierać inną encję: ENT-Disposition contains ENT-DispositionItem,
  # czyli dyspozycja zawiera swoje pozycje. Analityk zaznacza takie zawieranie,
  # wpisując „zawiera” w kolumnie relacji w tabeli „Powiązania” encji.
  # Pozostałe powiązania z tej tabeli nie tworzą relacji w grafie.
  - { source: ENT,      relation: contains,        target: ENT,      cardinality: "1:N" }

  # ── Grupa 3: realizacja ────────────────────────────────────────────────

  # Scenariusz UC lub TUC wskazuje wymagania REQ i reguły biznesowe RB z BFS,
  # które realizuje: UC-001 realizes BFS-001.REQ-01.
  - { source: UC,       relation: realizes,        target: REQ,      cardinality: "N:N" }
  - { source: TUC,      relation: realizes,        target: REQ,      cardinality: "N:N" }
  - { source: UC,       relation: realizes,        target: RB,       cardinality: "N:N" }
  - { source: TUC,      relation: realizes,        target: RB,       cardinality: "N:N" }
  # UC, TUC, API, INT i QUE wskazują zdolność (CAP), do której należą. Jeśli
  # dokument należy do kilku zdolności, ma kilka wpisów: UC-002 realizes
  # CAP-001 oraz UC-002 realizes CAP-002.
  - { source: UC,       relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: TUC,      relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: API,      relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: INT,      relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: QUE,      relation: realizes,        target: CAP,      cardinality: "N:N" }
  # LDM wskazuje pojęcia z DDM, które realizuje: LDM-001 realizes
  # DDM-001.DOM-Dyspozycja. Jeden DDM może mieć kilka LDM.
  # Walidator sprawdza tu trzy rzeczy:
  #   - wszystkie pojęcia DOM wskazane przez jeden LDM pochodzą z jednego DDM,
  #   - encja realizuje tylko takie pojęcie, które realizuje też jej LDM,
  #   - encja realizuje tylko taką regułę RD, która pochodzi z DDM jej LDM.
  - { source: LDM,      relation: realizes,        target: DOM,      cardinality: "N:N" }
  # Encja i maszyna stanów wskazują pojęcie domenowe, które opisują. Encja
  # podaje je w nagłówku „Realizuje pojęcie (DDM)”, a maszyna stanów w polu
  # „Obiekt (pojęcie DDM)”. Przykład: ENT-Disposition realizes
  # DDM-001.DOM-Dyspozycja i STM-001 realizes DDM-001.DOM-Dyspozycja.
  # Jeśli w DDM nie ma pasującego pojęcia, trzeba je dopisać do DDM. Nie
  # wskazuje się wtedy pojęcia, które jest tylko najbardziej podobne.
  # Encja, która opisuje szczególny rodzaj ogólnego pojęcia, wskazuje to ogólne
  # pojęcie: ENT-Deposit (lokata) realizes DDM-002.DOM-Rachunek.
  # Encje i maszyny stanów czysto techniczne nie wskazują żadnego pojęcia.
  # Przykłady: ENT-StatusDict oraz STM-013 (cykl życia sesji).
  - { source: ENT,      relation: realizes,        target: DOM,      cardinality: "N:1" }
  - { source: STM,      relation: realizes,        target: DOM,      cardinality: "N:1" }
  # Encja wskazuje regułę domenową RD wtedy, gdy jej reguła walidacyjna RW
  # z tej reguły domenowej wynika. Identyfikator RD podaje się w kolumnie RD
  # w tabeli „Reguły walidacyjne”.
  - { source: ENT,      relation: realizes,        target: RD,       cardinality: "N:N" }
  # Przepływ FLOW, proces BPMN i maszyna stanów STM wskazują zdolność (CAP),
  # do której należą.
  - { source: FLOW,     relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: BPMN,     relation: realizes,        target: CAP,      cardinality: "N:N" }
  - { source: STM,      relation: realizes,        target: CAP,      cardinality: "N:N" }

  # ── Grupa 4: korzystanie z innych elementów ────────────────────────────
  # Scenariusze UC i TUC wskazują API i zdarzenia QUE podane w kolumnie
  # „Wywołanie” w tabelach kroków. Dotyczy to tabeli głównych kroków, tabel
  # wariantów A i tabel sytuacji błędnych E. Przykład: w UC-001 krok
  # „Zapisuje dyspozycję” ma w kolumnie „Wywołanie” API-001.
  # TUC wskazuje w tej kolumnie także integracje INT: TUC-010 consumes INT-011.
  # UC nie wywołuje integracji wprost. Robi to API, które UC wywołuje.
  # TUC wskazuje dodatkowo zdarzenie z pola „Trigger”, czyli zdarzenie, które
  # go uruchamia.
  # Krok może zdarzenie QUE publikować albo odbierać. W obu przypadkach wpis
  # ma relację consumes. Przykłady: UC-001 publikuje QUE-001
  # DispositionAccepted, a TUC-010 odbiera QUE-010 AccountOpened, podane
  # w polu „Trigger”.
  - { source: UC,       relation: consumes,        target: API,      cardinality: "N:N" }
  - { source: TUC,      relation: consumes,        target: API,      cardinality: "N:N" }
  - { source: TUC,      relation: consumes,        target: INT,      cardinality: "N:N" }
  - { source: UC,       relation: consumes,        target: QUE,      cardinality: "N:N" }
  - { source: TUC,      relation: consumes,        target: QUE,      cardinality: "N:N" }
  # Przepływ FLOW wskazuje integracje INT, zdarzenia QUE i procesy BPMN podane
  # w kolumnie „Wywołanie” w opisie przepływu. Przykład: FLOW-001 consumes
  # INT-001 i publikuje QUE-001, co także zapisuje się jako consumes. Proces
  # BPMN przepływ wskazuje wtedy, gdy ten proces uruchamia.
  # Przepływ nie wskazuje API. Relację między API a przepływem zapisuje API
  # (API consumes FLOW), więc przepływ nie wymienia API, które z niego korzystają.
  - { source: FLOW,     relation: consumes,        target: INT,      cardinality: "N:N" }
  - { source: FLOW,     relation: consumes,        target: QUE,      cardinality: "N:N" }
  - { source: FLOW,     relation: consumes,        target: BPMN,     cardinality: "N:N" }
  # Krok procesu SPEC-WF wskazuje API, INT i QUE wymienione w sekcji
  # „Wywoływane zasoby”. Przykłady: SPEC-WF-001 consumes API-005,
  # a SPEC-WF-012 publikuje QUE-012, co także zapisuje się jako consumes.
  - { source: SPEC-WF,  relation: consumes,        target: API,      cardinality: "N:N" }
  - { source: SPEC-WF,  relation: consumes,        target: INT,      cardinality: "N:N" }
  - { source: SPEC-WF,  relation: consumes,        target: QUE,      cardinality: "N:N" }
  # Krok procesu wskazuje inne kroki, z których odczytuje zmienne. Te kroki
  # są podane w kolumnie „Źródło” w sekcji „Zmienne procesowe — wejście”,
  # a w kroku call-activity także „— wyjście” (krok podprocesu, który zapisał
  # zmienną). Przykłady: SPEC-WF-002 consumes SPEC-WF-001,
  # SPEC-WF-008 consumes SPEC-WF-009.
  - { source: SPEC-WF,  relation: consumes,        target: SPEC-WF,  cardinality: "N:N" }
  # Zdolność CAP wskazuje zdarzenia, które odbiera. Są one wymienione w sekcji
  # „Zdarzenia i kontrakty domenowe”. Zdolność, która zdarzenie publikuje,
  # nie ma tu wpisu. Zamiast tego samo zdarzenie wskazuje swoją zdolność:
  # QUE-001 realizes CAP-001.
  - { source: CAP,      relation: consumes,        target: QUE,      cardinality: "N:N" }
  # API, INT i QUE wskazują encje wymienione w sekcji „Encje”. Wskazują tylko
  # te encje, które w żądaniu, odpowiedzi albo treści zdarzenia występują jako
  # osobny obiekt. Dokładna zasada jest niżej, w części „Którą encję wskazuje
  # dokument, który z niej korzysta”. Przykłady: API-001 consumes
  # ENT-Disposition i ENT-StatusDict, INT-010 consumes ENT-Client,
  # QUE-002 consumes ENT-Client.
  - { source: API,      relation: consumes,        target: ENT,      cardinality: "N:N" }
  - { source: INT,      relation: consumes,        target: ENT,      cardinality: "N:N" }
  - { source: QUE,      relation: consumes,        target: ENT,      cardinality: "N:N" }
  # API wskazuje integracje INT, które woła poza swoimi przepływami. Są one
  # wymienione w sekcji „Zależności” szablonu API. Przykład: API-003 consumes
  # INT-010.
  - { source: API,      relation: consumes,        target: INT,      cardinality: "N:N" }
  # API wskazuje przepływy FLOW, które opisują część jego przebiegu, i procesy
  # BPMN, które uruchamia. Podaje je w sekcji „Zachowanie”. Jedno API może
  # korzystać z kilku przepływów, a jeden przepływ może być częścią kilku API.
  # Przykłady: API-001 consumes FLOW-001 i FLOW-002, API-006 consumes BPMN-001.
  - { source: API,      relation: consumes,        target: FLOW,     cardinality: "N:N" }
  - { source: API,      relation: consumes,        target: BPMN,     cardinality: "N:N" }
  # API wskazuje też kroki procesu typu user-task, które przypisuje, odkłada
  # albo kończy. Człowiek wykonuje te operacje tylko przez API, więc relację
  # zapisuje API i podaje krok w sekcji „Zachowanie”: API-015 przypisuje krok
  # SPEC-WF-005, a API-008 go kończy. Jeden krok wskazuje więc kilka API,
  # a jedno API może obsługiwać kilka kroków.
  - { source: API,      relation: consumes,        target: SPEC-WF,  cardinality: "N:N" }
  # Sekcja ekranu SCRSEC wskazuje encje, z których pola sekcji biorą dane
  # (atrybut „Źródło danych”) albo w których dane z pól są zapisywane
  # (atrybut „Miejsce utrwalenia”). Przykład: SCRSEC-001 consumes ENT-Client.
  - { source: SCRSEC,   relation: consumes,        target: ENT,      cardinality: "N:N" }
  # Sekcja ekranu SCRSEC wskazuje też API, które wywołuje sama sekcja. Takie
  # wywołania opisuje atrybut „Zachowanie” sekcji. Chodzi o podpowiadanie
  # wartości, walidację w trakcie wpisywania i pobieranie słownika wartości.
  # Sekcja nie wywołuje integracji INT wprost. Robi to API, które sekcja
  # wywołuje.
  - { source: SCRSEC,   relation: consumes,        target: API,      cardinality: "N:N" }

  # ── Grupa 5: progi jakościowe ──────────────────────────────────────────
  # Dokument wskazuje wiersze NFRT z dokumentu NFR, czyli progi jakościowe,
  # które musi spełnić. Każdy typ dokumentu podaje je we własnej sekcji:
  # BFS w sekcji „Wymagania niefunkcjonalne”, a UC, TUC, API, INT i CAP
  # w sekcji „Ograniczenia NFR”. Przykład: API-001 constrained_by
  # NFR-001.NFRT-PERF-01.
  - { source: BFS,      relation: constrained_by,  target: NFRT,     cardinality: "N:N" }
  - { source: UC,       relation: constrained_by,  target: NFRT,     cardinality: "N:N" }
  - { source: TUC,      relation: constrained_by,  target: NFRT,     cardinality: "N:N" }
  - { source: CAP,      relation: constrained_by,  target: NFRT,     cardinality: "N:N" }
  - { source: API,      relation: constrained_by,  target: NFRT,     cardinality: "N:N" }
  - { source: INT,      relation: constrained_by,  target: NFRT,     cardinality: "N:N" }

  # ── Grupa 6: konwencje ─────────────────────────────────────────────────
  # Kontrakt wskazuje konwencję, którą stosuje: wspólny model odpowiedzi
  # błędnej, sposób autentykacji, zasady ponawiania wywołań albo nagłówki
  # komunikatów. Wskazanie stoi w miejscu, w którym bez konwencji kontrakt
  # powtórzyłby jej treść. Przykłady: API-009 applies CONV-001 w sekcji
  # „Struktura odpowiedzi błędnej”, INT-001 applies CONV-003 w sekcji „Obsługa
  # błędów”. Kontrakt, który odstępuje od konwencji, nie wskazuje jej i sam
  # opisuje swoje zachowanie: INT-003 nie ponawia wywołań.
  - { source: API,      relation: applies,         target: CONV,     cardinality: "N:N" }
  - { source: INT,      relation: applies,         target: CONV,     cardinality: "N:N" }
  - { source: QUE,      relation: applies,         target: CONV,     cardinality: "N:N" }

  # ── Grupa 7: role i mapy ───────────────────────────────────────────────

  # Scenariusz UC lub TUC wskazuje role aktorów, które w nim uczestniczą:
  # UC-001 involves ACTOR-001.ROLE-01.
  - { source: UC,       relation: involves,        target: ROLE,     cardinality: "N:N" }
  - { source: TUC,      relation: involves,        target: ROLE,     cardinality: "N:N" }
  # Krok procesu SPEC-WF wskazuje rolę podaną w polu „aktor/serwis” w sekcji
  # „Kontekst”. W kroku typu user-task, wykonywanym przez człowieka, to pole
  # zawiera ID roli i ono tworzy relację. W kroku typu service-task,
  # wykonywanym automatycznie, to pole zawiera nazwę serwisu, która relacji
  # nie tworzy.
  - { source: SPEC-WF,  relation: involves,        target: ROLE,     cardinality: "N:N" }
  # Mapa wskazuje dokumenty, które zestawia. Mapa scenariuszy UCMAP wskazuje
  # scenariusze UC i TUC, a mapa nawigacji NAV wskazuje ekrany.
  # Przykłady: UCMAP-001 groups UC-001, NAV-001 groups SCR-001.
  - { source: UCMAP,    relation: groups,          target: UC,       cardinality: "N:N" }
  - { source: UCMAP,    relation: groups,          target: TUC,      cardinality: "N:N" }
  - { source: NAV,      relation: groups,          target: SCR,      cardinality: "N:N" }

# ── Czego nie wolno zapisać ──────────────────────────────────────────────
#
# 1. Całe dokumenty BFS, NFR, DDM i ACTOR nie mogą być celem relacji.
#    Zawsze wskazuje się konkretny wiersz w takim dokumencie: BFS-001.REQ-01,
#    NFR-001.NFRT-PERF-01, DDM-001.DOM-Dyspozycja, ACTOR-001.ROLE-01.
#
# 2. Graf nie zapisuje kolejności aktywności ani kroków. Kolejność wynika
#    z przepływu FLOW i procesu BPMN, które te aktywności i kroki zawierają.
#    Jeśli krok zależy od zmiennych innego kroku, zapisuje się to jako
#    SPEC-WF consumes SPEC-WF.
#
# 3. API nie wskazuje innego API (nie ma trójki API consumes API), a przepływ
#    nie wskazuje API (nie ma trójki FLOW consumes API). Część przebiegu
#    wspólną dla kilku API opisuje jeden przepływ, a każde z tych API ma do
#    niego wpis consumes.
#
# 4. Zdolność nie wskazuje wymagania (nie ma trójki CAP realizes REQ). To, do
#    której zdolności należy wymaganie, wynika ze scenariusza, który realizuje
#    jedno i drugie: UC-001 realizes BFS-001.REQ-01 oraz UC-001 realizes CAP-001.
#
# 5. Krok procesu nie wskazuje zdolności (nie ma trójki SPEC-WF consumes CAP).
#    Krok wskazuje API, INT albo QUE, które wywołuje, a zdolność wynika z wpisu
#    realizes tego wywoływanego elementu. Przykład: SPEC-WF-014 consumes
#    INT-017, a INT-017 realizes CAP-022.
#
# 6. Scenariusz techniczny nie zawiera ekranów (nie ma trójki TUC contains SCR).
#    TUC działa bez udziału człowieka, więc nie ma ekranów.
#
# 7. Encja nie odwołuje się do innej encji (nie ma trójki ENT references ENT).
#    Zwykłych odwołań między encjami, na przykład gdy dyspozycja wskazuje
#    klienta, graf nie zapisuje. Ocenia je analityk. W grafie zapisuje się
#    tylko zawieranie encji w encji: ENT contains ENT (grupa 2).
#
# 8. Scenariusz UC i sekcja ekranu nie wskazują integracji (nie ma trójek
#    UC consumes INT i SCRSEC consumes INT). Integrację woła API, które
#    wskazuje scenariusz albo sekcja. Scenariusz techniczny TUC może wskazać
#    integrację wprost: TUC-010 consumes INT-011.
#
# 9. Konwencja nie wskazuje kontraktów, które ją stosują (nie ma trójki
#    CONV applies API), ani innej konwencji (nie ma trójki CONV applies CONV).
#    Listę kontraktów zwraca zapytanie change_scope dla konwencji: dla
#    CONV-003 wynik zawiera INT-001. Każda zasada leży w jednej konwencji
#    i nie korzysta z definicji z innej. Do innej konwencji dokument odsyła
#    nazwą, bez ID.
#
# 10. Krok procesu nie wskazuje ekranu (nie ma trójki SPEC-WF contains SCR)
#     ani API, które go obsługują. Człowiek przypisuje, odkłada i kończy krok
#     typu user-task tylko przez API, a relację zapisuje API:
#     API-008 consumes SPEC-WF-005. Scenariusz UC, którego krok woła to API,
#     wskazuje ekran formularza: UC-004 contains SCR-005. Wpis SPEC-WF
#     consumes API oznacza tylko API, które krok woła sam.

# ── Który dokument zapisuje wywołanie ────────────────────────────────────
# Wywołanie zapisuje ten dokument, który w swojej treści opisuje zachowanie
# z tym wywołaniem.
#
# Warstwa ekranu, czyli wywołania związane z pracą użytkownika na ekranie.
# Zadaj pytanie: czy wywołanie odpowiada krokowi w scenariuszu?
#   Tak -> Zapisz je w kolumnie „Wywołanie” kroku w UC lub TUC
#          (UC consumes API lub QUE, TUC consumes API, INT lub QUE).
#   Nie -> Zapisz je w atrybucie „Zachowanie” pola w sekcji ekranu SCRSEC
#          (SCRSEC consumes API). Tak jest przy podpowiadaniu wartości,
#          walidacji w trakcie wpisywania i pobieraniu słownika wartości.
# Jeśli nadal nie wiadomo, zadaj drugie pytanie: czy podpowiadanie można
# zastąpić zwykłą listą rozwijaną bez zmiany scenariusza?
#   Da się -> Wywołanie należy do sekcji ekranu.
#   Nie da się -> Wywołanie należy do scenariusza.
#
# Warstwa systemowa, czyli wywołania między elementami systemu. Wywołanie
# zapisuje ten dokument, który wywołuje:
#   przebieg API jest prosty albo nie opłaca się go wydzielać do przepływu
#     -> API consumes INT albo API consumes BPMN
#   część przebiegu API jest złożona albo wspólna dla kilku API
#     -> API consumes FLOW, a przepływ zapisuje wywołania ze swojej części:
#        FLOW consumes INT, QUE albo BPMN
#   krok procesu w silniku Workflow coś wywołuje -> SPEC-WF consumes API albo INT
#   API przypisuje, odkłada albo kończy krok procesu typu user-task
#     -> API consumes SPEC-WF
#   zdolność odbiera zdarzenie -> CAP consumes QUE
# Jedno API może korzystać z przepływów i jednocześnie wołać inne elementy
# wprost. Nie powtarza jednak wywołań, które zapisuje jego przepływ: jeśli
# FLOW-001 woła INT-001, API-001 nie ma wpisu consumes INT-001.

# ── Którą encję wskazuje dokument, który z niej korzysta ─────────────────
# API, INT, QUE i SCRSEC wskazują tylko te encje, które w ich treści
# występują jako osobny obiekt. Encja zagnieżdżona w innej encji, czyli część
# w całości, nie dostaje osobnego wpisu. Dokument dociera do niej przez wpis
# ENT contains ENT w encji, która ją zawiera.
# Przykłady:
#   POST /dispositions, pozycje są przesyłane wewnątrz dyspozycji
#     -> tylko ENT-Disposition
#   odpowiedź { disposition, dispositionItems }, pozycje są osobnym polem
#     -> obie encje: ENT-Disposition i ENT-DispositionItem
#   PATCH /dispositions/{id}/items/{itemId}, zmiana jednej pozycji
#     -> ENT-DispositionItem
#   sekcja ekranu „Pozycje” pokazuje listę pozycji
#     -> ENT-DispositionItem
#
# Walidator zgłasza ostrzeżenie, gdy dokument X wskazuje encję A i encję B,
# a encja A zawiera encję B. To tylko ostrzeżenie, a nie błąd, bo walidator
# nie zna kształtu żądania ani odpowiedzi i nie wie, czy B jest tam osobnym
# obiektem.
